target_id: casas-alvero-mod13-support-obstruction
search_date: '2026-09-23'
intended_contribution_unit: theorem
claims:
  modular_seed: |
    Over an algebraically closed field of characteristic 13, a monic
    polynomial X^20+a*X^16+c*X^3+d*X having the common-factor property
    with every Hasse derivative of orders 1 through 19 equals X^20.
    All coefficients may be zero; no witness distinctness is imposed.
  characteristic_zero: |
    For every e>=0, q=13^e and N=20q, at any root alpha of a nontrivial
    characteristic-zero degree-N Casas-Alvero polynomial, some derivative
    of order q*k with k in {2,4,5,6,7,13,14,15,17,18,19} is nonzero.
  degree20_corollary: |
    The monic centered normal form of a nontrivial characteristic-zero
    degree-20 Casas-Alvero polynomial has at least six nonzero terms,
    counting the leading monomial.
  exclusions:
    - No full Casas-Alvero or unrestricted degree-20 proof.
    - The nine-term ambient family is one specific support mask.
    - No bound of ten terms for all degree-20 polynomials.
    - No historical-priority or external-referee certification.
normalisation:
  support_index: 'Index m means coefficient of X^(n-m), derivative order n-m.'
  modular_scaling: 'If a!=0, scale an H16 witness to 1, making a=4 over F13.'
  boundary_cases: 'Zero coefficients and coincident witnesses are retained.'
  global_scaling: 'Translate any selected root to zero; scale a least-valuation nonzero root to 1.'
