target_id: casas-alvero-degree20-centered-five-term-bound
search_date: '2026-09-23'
intended_contribution_unit: theorem
claim:
  exact_statement: |
    Let f be a characteristic-zero polynomial of degree 20 sharing a
    nonconstant factor with every derivative of orders 1 through 19.
    Translate the unique root of f^(19) to zero and scale f to be monic.
    Either this normal form is X^20, or it has at least five nonzero
    monomials, including the leading monomial.
  exclusions:
    - No solution of the full degree-20 or all-degree Casas-Alvero conjecture.
    - No claim about the support size before centering.
    - No historical priority claim or external referee certification.
source:
  originating_reference: Casas-Alvero conjecture; CLO (2014), Theorem 2 and Proposition 15
  url: 'https://arxiv.org/html/1208.5404'
normalisation:
  indices: 'm denotes the coefficient of X^(20-m); derivative order is 20-m.'
  scaling: 'Mean root at zero, leading coefficient one, chosen Hasse-15 witness scaled to one.'
  basis_order: 'Exact monomial identities; no monomial-order assumption in the verifier.'
  symmetries:
    - Root witness collisions are allowed.
    - Arbitrary translations do not preserve the support count.
