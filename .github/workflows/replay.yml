name: candidate-replay
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional historical cross-check dependency
        if: matrix.python == '3.13'
        run: python -m pip install sympy==1.14.0
      - name: Integrity
        run: python -B replay.py --integrity-only
      - name: New theorem dependencies, both modes
        run: python -B replay_new.py --output "$RUNNER_TEMP/new-replay"
      - name: Inherited finite dependencies
        run: python -B replay.py --output "$RUNNER_TEMP/inherited-replay"
      - name: Semantic negative controls
        run: python -B test_publication.py
